<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}Casino Virtual{% endblock %}</title>
</head>

<body>

    <header class="encabezado">
        <h1>El casino de escudos</h1>
    </header>

    <nav class="navegacion">
        <ul class="navegacion_enlaces">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Nuestro equipo</a></li>
            <li><a href="#">Proyectos</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <!-- ÚNICO BLOQUE NECESARIO PARA EL CONTENIDO -->
    <main class="principal_base">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="pie_pagina">
        <p>&copy; 2026 Casino de Escudos</p>
    </footer>

</body>
</html>

{% extends "base.html" %}

{% block title %}Cargar Saldo - Casino Virtual{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2>Cargar Saldo</h2>
        <p class="subtitle">Selecciona tu tarjeta y el monto a recargar</p>

        <!-- Formulario de recarga -->
        <form action="{{ url_for('cargar_saldo') }}" method="POST" class="casino-form">
            
            <!-- Selector de Tarjetas del Usuario -->
            <div class="input-group">
                <label for="tarjeta_id">Seleccionar Tarjeta</label>
                <select id="tarjeta_id" name="tarjeta_id" required>
                    <option value="" disabled selected>-- Mis Tarjetas Registradas --</option>
                    {% for tarjeta in tarjetas %}
                        <!-- El value envía el ID de la tarjeta, y mostramos tipo y número/ID al usuario -->
                        <option value="{{ tarjeta.idTarjetas }}">
                            {{ tarjeta.idTarjetas }}. {{ tarjeta.tipo }} (**** {{ tarjeta.numero_tarjeta[-4:] }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Ingresar el Monto -->
            <div class="input-group">
                <label for="monto">Monto a Sumar ($)</label>
                <input type="number" id="monto" name="monto" placeholder="Ej. 1000.00" step="0.01" min="1" required>
            </div>

            <!-- Botón de Confirmación -->
            <button type="submit" class="btn-submit">Proceder con la Carga</button>
        </form>

        <div class="form-footer">
            <a href="{{ url_for('panel') }}">← Volver al Panel</a>
        </div>
    </div>
</div>
{% endblock %}
